name: Refresh data and deploy Vercel snapshot

on:
  schedule:
    # 11:17 UTC is after the previous day's NBA/WNBA games in North America.
    # GitHub scheduled workflows may start later than the requested minute.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-public-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_ORG_ID: team_UPBmLwEMcm7WTqC5o00AASUC
      VERCEL_PROJECT_ID: prj_rUI2qlg3baRdxkb6b2JALeFx8n5H
    steps:
      - uses: actions/checkout@v4
        with:
          # Player history and the trained models are Git LFS files; without this the
          # runner gets 130-byte pointer files and the API reports history unavailable.
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN"; exit 1; }

      - name: Install Python and frontend dependencies
        run: |
          # Public snapshot runtime only; skip Dash, notebooks, Kaggle, and tests.
          # Pinned to the versions the saved models and tests were built on: pandas 3 and
          # scikit-learn 1.9 broke history loading and model unpickling on unpinned runners.
          python -m pip install 'pandas>=2.2,<3' 'numpy>=2.2,<2.3' 'pyarrow>=14.0' \
            'nba_api>=1.4' 'scikit-learn==1.6.1' 'scipy>=1.11' 'xgboost>=2.1.3,<3' \
            'requests>=2.31' 'python-dotenv>=1.0' \
            'fastapi>=0.111' 'uvicorn[standard]>=0.29' 'python-multipart>=0.0.9'
          npm ci --prefix frontend

      - name: Restore persistent odds credit ledger
        uses: actions/cache/restore@v4
        with:
          path: data/personal.sqlite3
          key: odds-ledger-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            odds-ledger-${{ github.ref_name }}-

      - name: Refresh historical data and sportsbook quotes, then export public snapshot
        timeout-minutes: 50
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_AUTO_REFRESH: "0"
        run: |
          set -euo pipefail
          # Only the explicit export refresh spends credits. The restored ledger
          # keeps daily/monthly allowances across otherwise ephemeral runners.
          # stats.nba.com blocks GitHub-hosted runners, so a failed history pull must not
          # stop odds, props and the deploy; they fall back to the committed history.
          python scripts/refresh_nba_history.py || echo "::warning::NBA history refresh failed; using committed history"
          python scripts/refresh_wnba_history.py || echo "::warning::WNBA history refresh failed; using committed history"
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/snapshot-api.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=2)' 2>/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/snapshot-api.log"
              exit 1
            fi
            sleep 2
          done
          python scripts/export_api.py --refresh-odds --out frontend/public/data --api http://127.0.0.1:8000 || {
            cat "$RUNNER_TEMP/snapshot-api.log"
            exit 1
          }
          du -sh frontend/public/data
          python -c 'from pathlib import Path; p=Path("frontend/public/data"); n=sum(f.stat().st_size for f in p.rglob("*") if f.is_file()); print(f"Snapshot payload: {n:,} bytes")'

      - name: Save odds credit ledger even when export fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/personal.sqlite3
          key: odds-ledger-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Pull Vercel production settings
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build static snapshot for Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_EXPORT: "1"
          NEXT_PUBLIC_DATA_MODE: static
        run: |
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          du -sh .vercel/output
          python -c 'from pathlib import Path; p=Path(".vercel/output"); n=sum(f.stat().st_size for f in p.rglob("*") if f.is_file()); print(f"Vercel build output: {n:,} bytes")'

      - name: Deploy snapshot to production
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prebuilt --archive=tgz --prod --token="$VERCEL_TOKEN"
